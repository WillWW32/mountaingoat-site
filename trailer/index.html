<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mountain Goats — Trailer</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0a0a;color:#f2ede2;font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}
  img.badge{height:84px;border-radius:8px;margin-bottom:18px;}
  h1{font-family:'Oswald';text-transform:uppercase;letter-spacing:.06em;font-size:clamp(22px,5vw,34px);}
  .gold{color:#e8a849;}
  #player{width:min(960px,94vw);aspect-ratio:16/9;background:#000;border:1px solid rgba(232,168,73,.4);border-radius:12px;overflow:hidden;margin:22px 0;display:none;}
  #player iframe{width:100%;height:100%;border:0;}
  #cd{font-family:'Oswald';font-size:clamp(34px,9vw,64px);font-weight:700;color:#e8a849;margin:14px 0 4px;}
  .sub{color:rgba(255,255,255,.65);font-size:15px;max-width:560px;line-height:1.6;}
  a.btn{display:inline-block;margin-top:22px;background:#e8a849;color:#111;text-decoration:none;font-family:'Oswald';font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:13px 26px;border-radius:9px;}
</style>
</head>
<body>
  <img class="badge" src="/assets/badge.png" alt="Mountain Goats">
  <h1 id="head">The trailer drops in</h1>
  <div id="cd">—</div>
  <div id="player"></div>
  <p class="sub" id="sub">A Hoop Dreams-style documentary about the kids Missoula raised. Enter the free ticket giveaway — early entries count double.</p>
  <a class="btn" href="/#giveaway">Enter the Ticket Giveaway</a>
<script>
const SB='https://nrfiomvamfcrvopynfdf.supabase.co';
const K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yZmlvbXZhbWZjcnZvcHluZmRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg1MDY5OTgsImV4cCI6MjA4NDA4Mjk5OH0.J7bEn5YtQ69WbVMsga5oIEewapJV9Nf8OEK2xWefAYU';
let drop=new Date('2026-07-19T19:00:00-06:00'), url='';
fetch(SB+'/rest/v1/site_config?select=key,value',{headers:{apikey:K,Authorization:'Bearer '+K}})
 .then(r=>r.json()).then(rows=>{(rows||[]).forEach(r=>{
   if(r.key==='trailer_drop_at'&&r.value) drop=new Date(r.value);
   if(r.key==='trailer_url') url=r.value; }); tick();});
function tick(){
  const now=new Date(), d=drop-now;
  if(d<=0 && url){
    document.getElementById('head').innerHTML='Mountain <span class="gold">Goats</span> — Official Trailer';
    document.getElementById('cd').style.display='none';
    const p=document.getElementById('player');
    if(p.style.display!=='block'){p.style.display='block';p.innerHTML='<iframe src="'+url+'" allow="autoplay; fullscreen" allowfullscreen></iframe>';}
    document.getElementById('sub').textContent='Share it — and enter the free ticket giveaway for the community screening.';
    return;
  }
  if(d<=0){ document.getElementById('cd').textContent='Any minute now…'; setTimeout(tick,30000); return; }
  const dd=Math.floor(d/86400000),h=Math.floor(d/3600000)%24,m=Math.floor(d/60000)%60,s=Math.floor(d/1000)%60;
  document.getElementById('cd').textContent=dd+'d '+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
  setTimeout(tick,1000);
}
tick();
</script>
</body>
</html>
